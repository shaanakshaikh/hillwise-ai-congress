name: Validate quiz

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check dist/app.js
          node --check dist/engine.js
          node --check dist/quiz-config.js
      - name: Validate configuration and content
        run: node scripts/validate.mjs
      - name: Check quiz engine behavior
        run: node scripts/test-engine.mjs
      - name: Check downloadable question data is current
        run: node scripts/export-data.mjs --check
